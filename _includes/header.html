<header class="site-header">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="site-brand" aria-label="Icebingk 首页">
      <span class="brand-mark" aria-hidden="true">I</span>
      <span>{{ site.title | default: "Icebingk" }}</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox" aria-label="展开导航菜单">
      <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
        <span></span><span></span><span></span>
      </label>

      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">首页</a></li>
        <li><a href="{{ '/projects/' | relative_url }}" class="nav-link{% if page.url contains '/projects' %} active{% endif %}">项目</a></li>
        <li><a href="{{ '/blog/' | relative_url }}" class="nav-link{% if page.url contains '/blog' or page.layout == 'post' %} active{% endif %}">博客</a></li>
        <li><a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.url == '/about/' %} active{% endif %}">关于</a></li>
        <li><a href="https://icebingk.github.io/nowcoder-quiz/" class="nav-link nav-link-featured" target="_blank" rel="noopener">在线题库 ↗</a></li>
      </ul>
    </nav>
  </div>
</header>
